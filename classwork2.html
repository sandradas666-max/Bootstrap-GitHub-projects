<!doctype html>
<html lang="en">
  <head>
    <title>classwork1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

  </head>
  <body>
    <div class="container">
      <div class="row mt-5 ">
        <div class="col-md-8 text-center mx-3">
          <h1 class="display-4 font-weight-bold">Student Profile</h1>
        </div>

        <div class="col-md-8 text-right ">
          <blockquote class="blockquote">
            "Learning never exhausts the mind."
          </blockquote>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-8 text-center">
          <img
            src="https://thumbs.dreamstime.com/b/woman-cv-resume-25917903.jpg"
            class="rounded-circle img-fluid mx-auto d-block" width="250" height="250"
            alt="profile image"
          />
        </div>
      </div>

      <div class="row mt-5 ">
        <div class="col-md-6 mx-auto table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="thead-dark">
                    <tr>
                    <th>Subject</th>
                    <th>Mark Scored</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                    <td>English</td>
                    <td>80</td> 
                    </tr>

                    <tr>
                      <td>Chemistry</td>
                      <td>60</td> 
                    </tr>

                     <tr>
                      <td>Maths</td>
                      <td>95</td> 
                    </tr>


                </tbody>
            </table>
        </div>

      </div>

      <div class="row mt-5 alert  alert-success alert-dismissible mx-3"><strong>Profile updated Successfully!</strong> 
      
        <button type="button" class="close" data-dismiss="alert">&times;</button>
      </div>

    </div>
  </body>
</html>
