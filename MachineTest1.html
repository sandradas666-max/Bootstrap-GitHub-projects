<!doctype html>
<html lang="en">
  <head>
    <title>MachineTest1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <style>
      body {
        background-color: #007bff;
        min-height: 100vh;
      }
      .signup-btn
      {
        width:150px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div
        class="row justify-content-center align-items-center";
        style="min-height: 100vh";
      >
      <!--Main column-->
        <div class="col-md-8">
          <div class="bg-white p-4">
            <h2>Sign Up</h2>
            <p class="mb-4">Please fill in this form to create an account!</p>

            <!--Name-->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input
                  type="text"
                  class="form-control bg-light"
                  placeholder="First Name"
                />
              </div>

              <div class="col-md-6">
                <input
                  type="text"
                  class="form-control bg-light"
                  placeholder="Last Name"
                />
              </div>
            </div>

            <!--Email-->
            <div class="form-group mt-3">
              <input
                type="email"
                class="form-control bg-light"
                placeholder="Email"
              />
            </div>

            <!--Password-->
            <div class="form-group mt-3">
              <input
                type="password"
                class="form-control bg-light"
                placeholder="Password"
              />
            </div>

            <!--Confirm Password-->
            <div class="form-group mt-3">
              <input
                type="password"
                class="form-control bg-light"
                placeholder="Confirm Password"
              />
            </div>

            <!--Checkbox-->
            <div class="form-check mt-3">
              <input type="checkbox" class="form-check-input" />

              <label class="form-check-label">
                I accet the <a href="#">Terms of Use</a> &
                <a href="#">Privacy Policy.</a>
              </label>
            </div>

            <!--sign up button-->
            <button type="submit" class="btn btn-primary mt-3 signup-btn">Sign Up</button>
          </div>

          <p class="text-center text-white mt-2">
            Already have an account?
            <a href="#" class="text-white"><u>Login here.</u></a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
