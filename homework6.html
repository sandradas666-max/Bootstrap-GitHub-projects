<!doctype html>
<html lang="en">
  <head>
    <title>homework6</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="form-group mt-3 py-3">
            <label for="name">Full Name:</label>
            <input
              type="text"
              class="form-control"
              id="name"
              placeholder="Enter name"
              name="name"
            />
          </div>
        </div>

        <div class="col-md-7">
          <div class="form-group mt-3 py-3">
            <label for="email">Email:</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter email"
              name="email"
            />
          </div>
        </div>

        <div class="col-md-7">
          <div class="col-md-7">
            <div class="form-group mt-3 py-3">
              <label for="comment">feedback message:</label>
              <textarea class="form-control" rows="3" id="comment"></textarea>
            </div>
            </div>
        </div>

            <div class="col-md-7">
                <label>Preferred Contact method</label>
                <div class="form-check">
                        <label class="form-check-label">
                          <input type="radio" class="form-check-input "name="optradio">Email
                        </label>
                      </div>
                      <div class="form-check">
                        <label class="form-check-label">
                          <input type="radio" class="form-check-input"name="optradio" >Phone
                        </label>
                      </div>

            </div>

          <div class="col-md-7 mt-3 py-3">

         
            <label>Satisfaction Level (1-10)</label>
            <input type="range" class="form-control-range"
                      name="satisfaction" min="1" max="10">
           </div>

            <div class="col-md-7">
                <div class="dropdown dropright">
              <div class="input-group mt-3 py-3">
                <div class="input-group-prepend">
                  <button
                    type="button"
                    class="btn btn-outline-secondary dropdown-toggle"
                    data-toggle="dropdown"
                  >
                    Choose the type of order
                  </button>
                  <div class="dropdown-menu dropdown-menu-right">
                    <a class="dropdown-item" href="#">Cake</a>
                    <a class="dropdown-item" href="#">Cookies</a>
                    <a class="dropdown-item" href="#">Pastries</a>
                  </div>
                </div>
              </div>
              
            </div>
            </div>
            
            <div class="col-md-7 mt-3 py-3">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          
        
      </div>
    </div>
  </body>
</html>
