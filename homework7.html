<!doctype html>
<html lang="en">
  <head>
    <title>homework7</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  </head>
  <body>
    <div class="container mt-4 py-4 justify-content-center">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div id="demo" class="carousel slide" data-ride="carousel">
            <ul class="carousel-indicators">
              <li data-target="#demo" data-slide-to="0" class="active"></li>
              <li data-target="#demo" data-slide-to="1"></li>
              <li data-target="#demo" data-slide-to="2"></li>
            </ul>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8a2VyYWxhJTIwbmF0dXJlfGVufDB8fDB8fHww"
                  alt="kerala"
                  width="1100"
                  height="500"
                  class="img-fluid"
                />
                <div class="carousel-caption">
                  <h1 class="text-white">Kerala</h1>
                </div>
              </div>

              <div class="carousel-item">
                <img
                  src="https://s7ap1.scene7.com/is/image/incredibleindia/a-journey-through-masthead-hero-1?qlt=82&ts=1727368343764"
                  alt="Hampi"
                  width="1100"
                  height="500"
                  class="img-fluid"
                />
                <div class="carousel-caption">
                  <h1 class="text-primary">Hampi</h1>
                </div>
              </div>

              <div class="carousel-item">
                <img
                  src="https://content.r9cdn.net/rimg/dimg/43/2c/fe92dfc3-lm-48454-167a97bd72f.jpg?width=1366&height=768&crop=true"
                  alt="Mysore"
                  width="1100"
                  height="500"
                  class="img-fluid"
                />
                <div class="carousel-caption">
                  <h1 class="text-primary">Mysore</h1>
                </div>
              </div>
            </div>
            <a class="carousel-control-prev" href="#demo" data-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" href="#demo" data-slide="next">
              <span class="carousel-control-next-icon"></span>
            </a>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-7">
          
          <button
            type="button"
            class="btn btn-info"
            data-toggle="modal"
            data-target="#myModal"
          >
            Book Now!
          </button>
          <div class="modal" id="myModal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h4 class="modal-title">Booking Details</h4>
                  

                  <button type="button" class="btn btn-success btn-lg"></button>

                  <button type="button" class="close" data-dismiss="modal">
                    &times;
                  </button>
                </div>
                <div class="modal-body">
                  <p><strong>Destination:</strong> Hampi</p>

                  <p><strong>Destination:</strong> Kerala</p>

                  <p><strong>Destination:</strong> Mysore</p>


                  <p><strong>Travel Date:</strong> 20 August 2026</p>

                  <p><strong>Number of People:</strong> 2</p>

                  <p><strong>Package:</strong> 4 Days / 3 Nights</p>

                  <p><strong>Price:</strong> ₹25,000 per person</p>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-danger"
                    data-dismiss="modal"
                  >
                    Close
                  </button>
                  </div>

                  <div class="text-center mt-3">
                    <span
                      data-toggle="tooltip"
                      data-placement="top"
                      title="Click Book Now to view booking details."
                    >
                      ℹ️
                    </span>
                  </div>
                
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
